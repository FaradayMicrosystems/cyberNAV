<!doctype html><html><head><meta charset="utf-8"><title>Button</title></head><body>
<div class="ph-screen ph-row">
  <button class="ph-btn">Recenter</button>
  <button class="ph-btn" aria-pressed="true">Traffic</button>
  <button class="ph-btn ph-btn--live" aria-pressed="true">Live</button>
  <button class="ph-btn ph-btn--live" aria-pressed="false">Live</button>
  <button class="ph-btn" aria-label="Pause">❚❚</button>
  <button class="ph-btn ph-btn--alert">End route</button>
  <button class="ph-btn" disabled>Offline maps</button>
</div></body></html>
