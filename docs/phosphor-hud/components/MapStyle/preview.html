<!-- @dsCard group="Map" height=460 subtitle="cyberNAV street map: every layer drawn from map-* tokens" -->
<!doctype html><html><head><meta charset="utf-8"><title>MapStyle</title>
<style>#w{position:relative;height:440px}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute}.top{top:10px;left:10px;right:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 12px}
.turn{left:10px;top:64px;width:230px}.big{font-family:var(--font-head);font-weight:500;font-size:22px;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.st{left:10px;right:10px;bottom:10px}</style></head><body>
<div id="w" class="ph-screen"><canvas id="c" aria-label="Example cyberNAV street map with an active route"></canvas>
 <div class="hud ph-panel top"><span style="font-family:var(--font-head);font-weight:600;letter-spacing:.2em">CYBERNAV</span>
  <input class="ph-input" id="q" style="flex:1;min-width:120px;max-width:260px" value="FERRY TERMINAL 3" aria-label="Search">
  <div class="ph-seg"><button class="ph-btn" aria-pressed="true">Drive</button><button class="ph-btn">Walk</button></div>
  <button class="ph-btn" aria-pressed="true" style="margin-left:auto">Traffic</button></div>
 <div class="hud ph-panel turn"><div class="ph-cap">In 350 m</div><div class="big">▸ RIGHT · HARBOUR RD</div>
  <div class="ph-cap" style="margin-top:8px">Arrive 14:32 · 12.4 km</div></div>
 <div class="hud ph-panel ph-status st"><span><span class="k">SCALE</span><span class="ph-scalebar" style="width:50px"></span>200 m</span><span><span class="k">HEADING</span>284° WNW</span><span class="help">R RECENTER · T TRAFFIC</span></div>
</div>
<script>
var cv=document.getElementById("c"),g=cv.getContext("2d"),cs=getComputedStyle(document.documentElement),T=function(n){return cs.getPropertyValue("--"+n).trim()};
function draw(){var r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;g.setTransform(d,0,0,d,0,0);var W=r.width,H=r.height;
 g.fillStyle=T("ground");g.fillRect(0,0,W,H);
 g.lineWidth=1;for(var x=0;x<W;x+=20){g.strokeStyle=x%200?T("map-grid-minor"):T("map-grid-major");g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
 for(var y=0;y<H;y+=20){g.strokeStyle=y%200?T("map-grid-minor"):T("map-grid-major");g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
 // water: bay on the right
 g.beginPath();g.moveTo(W*.72,0);g.bezierCurveTo(W*.62,H*.3,W*.8,H*.55,W*.7,H);g.lineTo(W,H);g.lineTo(W,0);g.closePath();g.fillStyle=T("map-water");g.fill();g.strokeStyle=T("map-water-edge");g.stroke();
 g.save();g.clip();g.strokeStyle=T("map-water");g.lineWidth=1;for(var k=-H;k<W;k+=8){g.beginPath();g.moveTo(k,0);g.lineTo(k+H,H);g.stroke()}g.restore();
 // park: dot pattern
 g.fillStyle=T("map-park");for(var px=W*.08;px<W*.26;px+=6)for(var py=H*.6;py<H*.82;py+=6)g.fillRect(px,py,1,1);
 // blocks with buildings
 g.lineWidth=1;for(var bx=40;bx<W*.66;bx+=70)for(var by=40;by<H;by+=60){if(bx<W*.28&&by>H*.55)continue;for(var j=0;j<3;j++){var w=12+((bx*7+by*3+j*11)%14),h=10+((bx+by*5+j*7)%12),ox=bx+8+j*20,oy=by+10+(j%2)*14;g.fillStyle=T("map-building");g.fillRect(ox,oy,w,h);g.strokeStyle=T("map-building-edge");g.strokeRect(ox+.5,oy+.5,w,h)}}
 // roads
 g.strokeStyle=T("map-road-minor");g.lineWidth=1;for(x=35;x<W*.68;x+=70){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(y=35;y<H;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(W*.68,y);g.stroke()}
 g.strokeStyle=T("map-road-major");g.lineWidth=1.6;g.beginPath();g.moveTo(0,H*.47);g.lineTo(W*.7,H*.47);g.stroke();g.beginPath();g.moveTo(W*.42,0);g.lineTo(W*.42,H);g.stroke();
 g.strokeStyle=T("map-road-highway");g.lineWidth=2.4;g.beginPath();g.moveTo(W*.62,0);g.bezierCurveTo(W*.5,H*.4,W*.6,H*.7,W*.55,H);g.stroke();
 // traffic overlays: caution dashed, alert dotted thick
 g.lineCap="round";g.setLineDash([6,4]);g.strokeStyle=T("signal-caution");g.lineWidth=2.4;g.beginPath();g.moveTo(W*.42,H*.2);g.lineTo(W*.42,H*.4);g.stroke();
 g.setLineDash([1,5]);g.strokeStyle=T("signal-alert");g.lineWidth=3.4;g.beginPath();g.moveTo(W*.1,H*.47);g.lineTo(W*.3,H*.47);g.stroke();g.setLineDash([]);g.lineCap="butt";
 // alt route
 g.setLineDash([4,5]);g.strokeStyle=T("map-route-alt");g.lineWidth=1.3;g.beginPath();g.moveTo(W*.24,H*.9);g.lineTo(W*.24,H*.13);g.lineTo(W*.62,H*.13);g.stroke();g.setLineDash([]);
 // active route with glow
 var R=[[W*.24,H*.9],[W*.42,H*.9],[W*.42,H*.47],[W*.6,H*.47]];g.shadowColor=T("phosphor");g.shadowBlur=8;g.strokeStyle=T("map-route");g.lineWidth=2.6;g.beginPath();R.forEach(function(p,i){i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])});g.stroke();g.shadowBlur=0;
 // destination brackets + self chevron
 var dx=W*.6,dy=H*.47,s=12,l=6;g.lineWidth=1.5;g.beginPath();[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(q){g.moveTo(dx+q[0]*s,dy+q[1]*(s-l));g.lineTo(dx+q[0]*s,dy+q[1]*s);g.lineTo(dx+q[0]*(s-l),dy+q[1]*s)});g.stroke();
 g.fillStyle=T("phosphor");g.beginPath();g.moveTo(dx,dy-4);g.lineTo(dx+4,dy);g.lineTo(dx,dy+4);g.lineTo(dx-4,dy);g.fill();
 g.save();g.translate(W*.24,H*.9);g.rotate(-Math.PI/2);g.shadowColor=T("phosphor");g.shadowBlur=8;g.beginPath();g.moveTo(9,0);g.lineTo(-6,5);g.lineTo(-3,0);g.lineTo(-6,-5);g.fill();g.restore();g.shadowBlur=0;
 // labels
 g.font="11px "+T("font-data");g.fillStyle=T("map-label");g.fillText("HARBOUR RD",W*.44+4,H*.47-6);g.fillText("5TH ST",W*.12,H*.47-6);g.fillText("BAY BRIDGE APPROACH",W*.43+6,H*.3);
 g.save();g.translate(W*.85,H*.5);g.fillText("MISSION BAY",-30,0);g.restore();g.fillText("CITY PARK",W*.12,H*.86);
 g.fillStyle=T("phosphor");g.font="12px "+T("font-data");g.fillText("FERRY TERMINAL 3",dx+16,dy-14);g.fillStyle=T("ink-muted");g.font="11px "+T("font-data");g.fillText("ARRIVE 14:32",dx+16,dy-1);
}
draw();addEventListener("resize",draw);document.fonts&&document.fonts.ready.then(draw);
new MutationObserver(function(){cs=getComputedStyle(document.documentElement);draw()}).observe(document.documentElement,{attributes:true});
</script></body></html>
