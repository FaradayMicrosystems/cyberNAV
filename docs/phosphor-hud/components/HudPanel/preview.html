<!-- @dsCard group="Surfaces" height=200 subtitle="Chamfered floating panel over the map" -->
<!doctype html><html><head><meta charset="utf-8"><title>HudPanel</title></head><body>
<div class="ph-screen" style="padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
  <section class="ph-panel" style="width:280px" aria-label="Route summary">
    <div class="ph-panel__head"><span>ROUTE PLOT</span><button class="ph-btn" aria-label="Close">✕</button></div>
    <div class="ph-cap">Destination</div>
    <div style="font-family:var(--font-head);font-weight:600;font-size:18px;letter-spacing:.14em;margin:4px 0 8px">FERRY TERMINAL 3</div>
    <div class="ph-cap">ETA // DISTANCE</div>
    <div style="font-family:var(--font-head);font-weight:500;font-size:22px;letter-spacing:.1em;font-variant-numeric:tabular-nums">14:32 · 12.4 KM</div>
  </section>
  <section class="ph-panel ph-panel--drop" style="width:220px" aria-label="Layers">
    <div class="ph-panel__title">MAP LAYERS</div>
    <div style="display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center"><span class="ph-cap">Traffic</span><button class="ph-btn" aria-pressed="true">On</button>
    <span class="ph-cap">Transit</span><button class="ph-btn" aria-pressed="false">Off</button></div>
  </section>
</div></body></html>
