<!-- @dsCard group="Inputs" height=170 subtitle="Labelled fields in a two-column form" -->
<!doctype html><html><head><meta charset="utf-8"><title>Field</title></head><body>
<div class="ph-screen" style="padding:16px"><form class="ph-form" style="max-width:360px" onsubmit="event.preventDefault()">
  <label class="ph-field wide">Search<input class="ph-input" id="f-search" type="text" placeholder="PLACE, ADDRESS OR COORDS" autocomplete="off"></label>
  <label class="ph-field">From<select class="ph-select" id="f-from"><option>Current position</option><option>Home</option></select></label>
  <label class="ph-field">Avoid<select class="ph-select" id="f-avoid"><option>Nothing</option><option>Tolls</option><option>Highways</option></select></label>
  <div class="wide" style="display:flex;gap:6px"><button class="ph-btn" aria-pressed="true">Plot route</button><button class="ph-btn">Clear</button></div>
</form></div></body></html>
